shell zsh -c fish

term                        xterm-kitty
background_opacity          0.95
dynamic_background_opacity  no
background_blur             16
tab_bar_edge                top
window_padding_width        5
font_size                   12

# symbol_map U+E1A0-U+E0A3,U+E0B0-U+E0C8,U+E0CC-U+E0D4 PowerlineSymbols

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="BlexMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
